name: Atualizar disponibilidade pela Arsenal

# Duas vezes por dia: 8h e 16h de Brasília (11h e 19h UTC). Também dá para rodar à mão na aba Actions.
on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-arsenal
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Ler a Arsenal e atualizar o catálogo
        run: |
          antes=$(python3 -c "import json; print(len(json.load(open('produtos.json'))['produtos']))")
          # o importador grava produtos.json, img/ e index.html na pasta onde ele está
          cp ferramentas/importar_arsenal.py .
          python3 importar_arsenal.py
          rm importar_arsenal.py
          depois=$(python3 -c "import json; print(len(json.load(open('produtos.json'))['produtos']))")
          echo "Produtos: $antes antes, $depois depois"
          # trava de segurança: se a Arsenal devolver bem menos produtos (site fora, bloqueio), não publica
          if [ "$depois" -lt $((antes * 85 / 100)) ]; then
            echo "::error::Catálogo caiu de $antes para $depois produtos; nada foi publicado."
            exit 1
          fi

      - name: Publicar se algo mudou
        run: |
          git add produtos.json index.html img p og
          # só a data de atualização mudou? então não publica
          if git diff --cached --quiet -I 'atualizado_em' -I 'ATUALIZADO_EM'; then
            echo "Nada mudou na Arsenal."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza disponibilidade e preços pela Arsenal"
          git pull --rebase origin main
          git push origin main
